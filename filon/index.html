<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCELLE</title>
    <meta name="description" content="Ocelle — une concession persistante sur Ysmère : extraire, acheminer, alimenter, creuser, commercer." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F2C6A0'/%3E%3Cpath d='M5 24 C5 12 27 12 27 24 Z' fill='%23E8735A' stroke='%231E1B2E' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 13 V5' stroke='%231E1B2E' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='5' r='2' fill='%233FB8AF' stroke='%231E1B2E' stroke-width='1.5'/%3E%3Cpath d='M3 25 H29' stroke='%231E1B2E' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- Back to front: Pixi canvas · HUD/panels · full screens · tooltip · fatal errors -->
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="screens"></div>
    <div id="tooltip" hidden></div>
    <div id="err" hidden></div>

    <script>
      // Surface fatal errors on screen — humans and the smoke test both want to see them.
      // Pixi init is async, so failures arrive as unhandled rejections, not 'error' events.
      (function () {
        function show(msg) {
          var err = document.getElementById('err');
          if (err) { err.hidden = false; err.textContent = 'Error: ' + msg; }
        }
        window.addEventListener('error', function (e) { show(e.message || e.error); });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason; show((r && (r.stack || r.message)) || String(r));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
